<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/form.css">

    <title>로그인 | 판다마켓</title>
</head>

<body>
    <div id="wrap">
        <div class="form">
            <div class="container">
                <header class="header">
                    <div class="header__logo">
                        <a href="/" class="header__link">
                            <img class="header__logo-img" src="../assets/images/logo.png" alt="판다마켓">
                            <span class="header__logo-text">판다마켓</span>
                        </a>
                    </div>
                </header>

                <form class="form-block" action="/" method="POST" onsubmit="return false;">
                    <div class="form-block__group">
                        <label class="form-block__label" for="email">이메일</label>
                        <input class="form-block__input" type="email" id="email" name="email" placeholder="이메일을 입력해주세요." required>
                        <span class="form-block__error-message"></span>
                    </div>
                    <div class="form-block__group">
                        <label class="form-block__label" for="password">비밀번호</label>
                        <input class="form-block__input" type="password" id="password" name="password" placeholder="비밀번호를 입력해주세요." required>
                        <button class="form-block__button-eye" type="button">
                            <img class="form-block__button-eye-icon" src="../assets/images/icons/eye.svg" alt="눈 열기">
                        </button>
                        <span class="form-block__error-message"></span>
                    </div>
                    <button class="form-block__button" type="submit">로그인</button>
                </form>

                <div class="oauth-block">
                    <span class="oauth-block__text">간편 로그인하기</span>

                    <div class="oauth-block__group">
                        <a class="oauth-block__button" href="https://www.google.com/" target="_blank">
                            <img class="oauth-block__icon" src="../assets/images/icons/google.png" alt="Google">
                            <span class="sr-only">Google로 로그인</span>
                        </a>
                        <a class="oauth-block__button" href="https://www.kakaocorp.com/page/" target="_blank">
                            <img class="oauth-block__icon" src="../assets/images/icons/kakao.png" alt="카카오">
                            <span class="sr-only">카카오로 로그인</span>
                        </a>
                    </div>
                </div>

                <div class="form__footer">
                    판다마켓이 처음이신가요? <a href="/pages/signup.html" class="form__footer-link">회원가입</a>
                </div>
            </div>
        </div>
    </div>
    <script src="../assets/utility/validation.js"></script>
    <script src="../assets/js/script.js"></script>
</body>

</html>
